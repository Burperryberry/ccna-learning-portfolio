name: Portfolio tests

on:
  pull_request:
    paths:
      - "automation/**"
      - ".github/workflows/portfolio-tests.yml"
  push:
    branches:
      - main
    paths:
      - "automation/**"
      - ".github/workflows/portfolio-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run automation tests
        run: python -m unittest discover -s automation -p "test_*.py" -v
